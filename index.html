<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com; frame-src https:; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Task live · Sintropía Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6B21F5; --purple-d:#4F14C4; --orange:#FF6B1A; --orange-d:#D9540A;
  --ink:#1B1530; --muted:#645F78; --line:#E6E2F0; --soft:#F6F3FF; --bg:#FFFFFF;
  --ok:#1B7F3B; --err:#B3261E; --radius:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:'Montserrat','Open Sans',sans-serif;line-height:1.2;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px}
.wrap.mid{max-width:780px}
header.top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
header.top .in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--purple);text-decoration:none}
.brand b{color:var(--orange);font-weight:800}
.by{color:var(--muted);font-size:13px}
.spacer{flex:1}
.rule{display:flex;align-items:center;gap:6px;margin:12px 0 4px}
.rule i{display:block;height:4px;border-radius:2px;background:var(--purple)}
.rule i:nth-child(1){width:34px}.rule i:nth-child(2){width:5px;height:5px;border-radius:50%;background:var(--orange)}.rule i:nth-child(3){width:16px}
.page-title{font-size:30px;font-weight:800;margin-top:32px}
.lead{color:var(--muted);margin:6px 0 0;max-width:64ch}
section.card,.card{border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-top:20px;background:#fff}
.card h2{font-size:19px;font-weight:700}
.card h3{font-size:16px;font-weight:700}
.card.privacy{border-left:4px solid var(--purple);background:#F6F3FF}
.card.privacy p{margin:8px 0 0;font-size:14.5px;line-height:1.55}
.card .sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=number],input[type=url],select,textarea{
  width:100%;padding:11px 12px;border:1.5px solid #CFC9E0;border-radius:8px;font:inherit;color:var(--ink);background:#fff}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid rgba(107,33,245,.35);outline-offset:1px;border-color:var(--purple)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 18px;font:600 15px 'Open Sans',sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--purple);color:#fff}.btn.primary:hover{background:var(--purple-d)}
.btn.act{background:var(--orange);color:#1B1530}.btn.act:hover{background:var(--orange-d);color:#fff}
.btn.ghost{background:#fff;color:var(--purple);border:1.5px solid var(--purple)}.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.callout{background:var(--soft);border:1px solid #D9CCFB;border-left:5px solid var(--purple);border-radius:8px;padding:12px 14px;font-size:14px;margin-top:14px}
.callout b{color:var(--purple-d)}
.callout.warn{background:#FFF4EB;border-color:#FFD2B0;border-left-color:var(--orange)}
.callout.warn b{color:var(--orange-d)}
.msg{margin-top:14px;padding:11px 14px;border-radius:8px;font-size:14px;border:1px solid}
.msg.err{background:#FDECEA;border-color:#F3B8B3;color:var(--err)}
.msg.ok{background:#E8F5EC;border-color:#B6DDC2;color:var(--ok)}
.detect{font-size:14px;margin-top:6px;color:var(--purple-d);font-weight:600;min-height:21px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--purple);flex:none}
.check label{margin:0;font-weight:400;font-size:14px}
.linkrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.linkrow code{flex:1 1 240px;min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1.5px solid currentColor;white-space:nowrap}
.chip.work{color:var(--purple)}.chip.busy{color:var(--orange-d)}.chip.done{color:var(--ok)}.chip.bad{color:var(--err)}.chip.mute{color:var(--muted)}
table.t{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.who{color:var(--muted);font-size:13px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.spin{display:inline-block;width:14px;height:14px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
.spin.dark{border-color:rgba(107,33,245,.25);border-top-color:var(--purple)}
@keyframes sp{to{transform:rotate(360deg)}}
details.more{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.more summary{cursor:pointer;font-weight:600;font-size:14px}
.teamrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;margin-top:10px}
@media(max-width:640px){.teamrow{grid-template-columns:1fr}.page-title{font-size:24px}}
.band{border-radius:var(--radius);padding:16px 20px;margin-top:22px;border-left:10px solid;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.band h1{font-size:24px;font-weight:800}
.band .by{color:var(--ink);opacity:.75}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;margin-top:4px}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.docbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.embed{margin-top:16px}
.embed iframe{width:100%;height:78vh;min-height:480px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.instr{white-space:pre-wrap;margin:8px 0 0}
ol.tips,ol.steps{padding-left:20px;margin:8px 0 0;font-size:14px}
ol.tips li,ol.steps li{margin:6px 0}
.big{font-size:32px;font-weight:800;font-family:'Montserrat',sans-serif}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:120px}
.kpi span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pick{display:flex;width:100%;text-align:left;align-items:center;gap:12px;border:1.5px solid var(--line);border-left-width:10px;border-radius:8px;background:#fff;padding:14px 16px;margin-top:10px;font:600 16px 'Open Sans',sans-serif;color:var(--ink);cursor:pointer}
.pick:hover{background:var(--soft)}
.pick .spacer{flex:1}
.result{border-left:8px solid var(--ok)}
.result.wait{border-left-color:var(--orange)}
.result.warnr{border-left-color:var(--orange)}
.result h2{font-size:20px}
.notes{font-size:13px;color:var(--muted);margin:8px 0 0;padding-left:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" id="brand" href="./">Task <b>live</b></a>
  <span class="by">Sintropía Social</span>
  <span class="spacer"></span>
  <span class="by" id="topRight"></span>
</div></header>
<main id="app" class="wrap"></main>

<script>
/* =====================================================================
 *  CONFIGURACIÓN
 * ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwUVEiQeexN-TGzEW67s8rFKEj6Pz75l-f_8YHGwE1R7tdtal51o_5xwFW0IQBxx6Yo/exec';       // URL del Web App de Apps Script (termina en /exec)
const PRIVACY_URL = '';                               // URL de tu aviso de privacidad (recomendable; se muestra en el formulario de "Finalizar")

const TEAM_COLORS = [
  { n: 'Rojo', t: '#C62828', b: '#FDE7E7' }, { n: 'Azul', t: '#1565C0', b: '#E3F0FD' },
  { n: 'Verde', t: '#2E7D32', b: '#E4F4E5' }, { n: 'Naranja', t: '#E65100', b: '#FFEBD9' },
  { n: 'Morado', t: '#6A1B9A', b: '#F1E3F7' }, { n: 'Turquesa', t: '#00796B', b: '#DDF3F0' },
  { n: 'Rosa', t: '#AD1457', b: '#FCE4EF' }, { n: 'Café', t: '#5D4037', b: '#EFE6E2' },
  { n: 'Mostaza', t: '#8D6E00', b: '#FFF6CC' }, { n: 'Índigo', t: '#283593', b: '#E4E6F7' },
  { n: 'Oliva', t: '#558B2F', b: '#EEF6DC' }, { n: 'Grafito', t: '#37474F', b: '#E7ECEF' }
];
const MAX_TEAMS = 12;
const KIND_LABEL = { doc: 'Documento de Google (Docs)', sheet: 'Hoja de cálculo de Google (Sheets)', slides: 'Presentación de Google (Slides)', externo: 'Enlace externo' };
const ESTADO = { activo: ['En trabajo', 'work'], procesando: ['Procesando', 'busy'], finalizado: ['Finalizado', 'done'] };
const CORREO = { enviado: ['Enviado', 'done'], pendiente: ['Pendiente', 'busy'], enviando: ['Enviando', 'busy'], sin_cuota: ['Sin cuota (se reenvía)', 'busy'], limite: ['Límite (se reenvía)', 'busy'], error: ['Error', 'bad'] };

/* =====================================================================
 *  UTILIDADES
 * ===================================================================== */
const app = document.getElementById('app');
const BASE = location.origin + location.pathname;
const $id = id => document.getElementById(id);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  });
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
const clear = el => { while (el.firstChild) el.removeChild(el.firstChild); };
// append que ignora null/false (el append nativo escribiría la palabra "null")
function add(parent, ...kids) { kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; parent.append(c.nodeType ? c : document.createTextNode(String(c))); }); return parent; }
const rule = () => h('div', { class: 'rule', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'));
const msg = (kind, text) => h('div', { class: 'msg ' + kind, role: kind === 'err' ? 'alert' : 'status' }, text);
function setMsg(box, kind, text) { clear(box); if (text) box.append(msg(kind, text)); }
function busy(btn, on, text) {
  if (on) { btn.dataset.t = btn.textContent; clear(btn); btn.append(h('span', { class: 'spin' }), text || 'Procesando…'); btn.disabled = true; }
  else { btn.textContent = btn.dataset.t || btn.textContent; btn.disabled = false; }
}
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  sget(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } },
  sset(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const chip = (map, key) => { const m = map[key] || [key || '—', 'mute']; return h('span', { class: 'chip ' + m[1] }, m[0]); };

async function api(action, data, timeoutMs) {
  if (API_URL.indexOf('PEGA_AQUI') === 0) { const e = new Error('Falta configurar API_URL en index.html (URL del Web App de Apps Script).'); e.config = true; throw e; }
  let res, j;
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), timeoutMs || 90000);
  try {
    res = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, data || {})), signal: ctl.signal });
    j = await res.json();
  } catch (e) { const err = new Error('No se pudo conectar con el servidor. Revisa tu conexión.'); err.network = true; throw err; }
  finally { clearTimeout(to); }
  if (!j.ok) { const err = new Error(j.error || 'Error desconocido.'); err.retry = !!j.retry; throw err; }
  return j;
}
async function apiRetry(action, data, tries) {
  let last;
  for (let i = 0; i < (tries || 3); i++) {
    try { return await api(action, data); }
    catch (e) { last = e; if (!(e.network || e.retry)) throw e; await sleep(700 * (i + 1) + Math.random() * 600); }
  }
  throw last;
}

function copyText(text, btn) {
  const done = () => { const old = btn.textContent; btn.textContent = 'Copiado'; setTimeout(() => { btn.textContent = old; }, 1400); };
  const fallback = () => { const ta = h('textarea', { style: { position: 'fixed', opacity: 0 } }); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function linkRow(label, url, openLabel) {
  const b = h('button', { class: 'btn ghost sm', type: 'button' }, 'Copiar');
  b.addEventListener('click', () => copyText(url, b));
  return h('div', {}, label ? h('label', {}, label) : null,
    h('div', { class: 'linkrow' }, h('code', { title: url }, url), b,
      h('a', { class: 'btn ghost sm', href: url, target: '_blank', rel: 'noopener noreferrer' }, openLabel || 'Abrir')));
}

/* ---------- enlaces del documento ---------- */
function safeUrl(u) {                                  // solo https; nunca javascript:, data:, etc.
  try { const x = new URL(String(u || '').trim()); return x.protocol === 'https:' ? x.href : null; } catch (e) { return null; }
}
function googleInfo(u) {
  const s = safeUrl(u); if (!s) return null;
  const x = new URL(s);
  if (x.hostname !== 'docs.google.com') return { url: s, kind: 'externo', host: x.hostname };
  const m = x.pathname.match(/^\/(document|spreadsheets|presentation)\/(?:u\/\d+\/)?d\/([\w-]{20,})/);
  if (!m) return { url: s, kind: 'externo', host: x.hostname };
  const kind = { document: 'doc', spreadsheets: 'sheet', presentation: 'slides' }[m[1]];
  return { url: 'https://docs.google.com/' + m[1] + '/d/' + m[2] + '/edit?usp=sharing', kind, host: x.hostname };
}
const isGoogleUrl = u => { try { return new URL(u).hostname === 'docs.google.com'; } catch (e) { return false; } };

function showError(title, text) {
  clear(app); app.classList.add('mid'); document.title = 'Task live';
  add(app, h('h1', { class: 'page-title' }, title), rule(), msg('err', text), h('p', {}, h('a', { class: 'btn ghost', href: './' }, 'Ir al inicio')));
}

/* =====================================================================
 *  INICIO: CREAR SALA (cualquier persona, sin clave)
 * ===================================================================== */
function viewHome() {
  document.title = 'Task live · Crear sala';
  clear(app); app.classList.remove('mid');
  const recent = (() => { try { const r = JSON.parse(store.get('tl_rooms') || '[]'); return Array.isArray(r) ? r.filter(x => x && typeof x.panel === 'string' && x.panel.indexOf(BASE) === 0) : []; } catch (e) { return []; } })();
  const name = h('input', { type: 'text', id: 'rn', maxlength: '80', required: true, placeholder: 'Ej. Taller de diagnóstico, sesión 2' });
  const url = h('input', { type: 'url', id: 'ru', required: true, placeholder: 'https://docs.google.com/document/d/…' });
  const detect = h('div', { class: 'detect', id: 'det', 'aria-live': 'polite' });
  const nInp = h('input', { type: 'number', id: 'rt', min: '1', max: String(MAX_TEAMS), value: '3', required: true });
  const teamBox = h('div', { id: 'teamBox' });
  const extBox = h('div');
  const note = h('textarea', { id: 'rx', maxlength: '600', placeholder: 'Qué deben hacer y en cuánto tiempo. Se muestra en la sala.' });
  const mins = h('input', { type: 'number', id: 'rm', min: '0', max: '600', placeholder: 'Ej. 30' });
  const out = h('div');
  let rows = [];
  let extInput = null;

  const renderRows = () => {
    const n = Math.max(1, Math.min(MAX_TEAMS, Number(nInp.value) || 1));
    const old = rows.map(r => r.value);
    rows = []; clear(teamBox);
    for (let i = 0; i < n; i++) {
      const c = TEAM_COLORS[i % TEAM_COLORS.length];
      const nameI = h('input', { type: 'text', maxlength: '40', placeholder: 'Equipo ' + (i + 1), 'aria-label': 'Nombre del equipo ' + (i + 1) });
      nameI.value = old[i] || '';
      add(teamBox, h('div', { class: 'teamrow' }, h('div', {}, h('span', { class: 'swatch', style: { background: c.t } }), c.n), nameI));
      rows.push(nameI);
    }
  };
  const renderExt = () => {
    const g = googleInfo(url.value); clear(extBox); extInput = null;
    if (g && g.kind === 'externo') {
      extInput = h('textarea', { id: 'rl', placeholder: 'Uno por línea. Si lo dejas vacío, todos los equipos usan el enlace de arriba.' });
      add(extBox, h('label', { for: 'rl' }, 'Enlace de cada equipo ', h('small', {}, '(opcional)')), extInput,
        h('div', { class: 'callout warn' }, h('b', {}, 'Este enlace no es de Google. '), 'Task live no puede copiarlo ni revisarlo con IA: los equipos trabajan directo en el enlace y, al finalizar, se registran sus datos y reciben un correo de agradecimiento.'));
    }
  };
  url.addEventListener('input', () => { const g = googleInfo(url.value); $id('det').textContent = g ? (KIND_LABEL[g.kind] + ' detectado') : (url.value ? 'Pega un enlace completo que empiece con https://' : ''); renderExt(); });
  nInp.addEventListener('input', renderRows);
  renderRows();

  const btn = h('button', { class: 'btn primary', type: 'submit' }, 'Crear sala');
  const form = h('form', { onsubmit: async e => {
    e.preventDefault(); setMsg(out, '', '');
    const g = googleInfo(url.value);
    if (!g) return setMsg(out, 'err', 'Pega el enlace completo del documento (debe empezar con https://).');
    const n = rows.length;
    const payload = { url: g.url, roomName: name.value.trim(), teams: n, teamNames: rows.map((r, i) => r.value.trim() || 'Equipo ' + (i + 1)), note: note.value.trim(), minutes: Number(mins.value) || 0 };
    if (extInput) {
      const ext = extInput.value.split(/\s+/).filter(Boolean);
      if (ext.some(u => !safeUrl(u))) return setMsg(out, 'err', 'Alguno de los enlaces por equipo no es válido (debe empezar con https://).');
      payload.externalLinks = ext;
    }
    busy(btn, true, g.kind === 'externo' ? 'Creando sala…' : 'Creando copias… puede tardar hasta un minuto');
    try {
      const r = await api('createRoom', payload, 170000);
      const base = BASE + '?r=' + r.rid, panel = base + '&f=' + r.fk;
      const list = recent.filter(x => x.panel !== panel);
      list.unshift({ name: r.nombre, panel, at: new Date().toISOString().slice(0, 10) }); store.set('tl_rooms', JSON.stringify(list.slice(0, 10)));
      renderCreated(r, base, panel);
    } catch (ex) { setMsg(out, 'err', ex.message); busy(btn, false); }
  } },
    h('label', { for: 'rn' }, 'Nombre de la sala'), name,
    h('label', { for: 'ru' }, 'Enlace del documento ', h('small', {}, '(Google Docs, Sheets o Slides; también funciona con otros enlaces https)')), url, detect, extBox,
    h('div', { class: 'callout' }, h('b', {}, 'Antes de crear: '), 'abre tu archivo en Google, pulsa Compartir y en "Acceso general" elige "Cualquier persona con el enlace" con el rol "Editor". Task live hará una copia por equipo y, al finalizar cada equipo, escribirá el resultado en tu documento original.'),
    h('div', { class: 'row', style: { marginTop: '4px' } }, h('div', {}, h('label', { for: 'rt' }, '¿Cuántos equipos habrá?'), nInp),
      h('div', {}, h('label', { for: 'rm' }, 'Tiempo sugerido en minutos ', h('small', {}, '(opcional)')), mins)),
    h('label', {}, 'Nombre de cada equipo ', h('small', {}, '(opcional; cada uno tendrá un color)')), teamBox,

          h('td', { class: 'who' }, t.estado !== 'finalizado' ? '—' : (t.escrito ? 'Escrito en el original' : 'Solo en la copia') + (t.ia ? ' · IA' : ' · sin IA') + (t.notas.length ? ' · ' + t.notas.length + ' nota(s)' : '')), h('td', {}, act));
      })))));

    clear(tableBox);
    add(tableBox, r.people.length ? h('div', { style: { overflowX: 'auto' } }, h('table', { class: 't' }, h('thead', {}, h('tr', {}, ['Equipo', 'Nombre', 'Correo', 'Organización', 'Fecha', 'Correo'].map(x => h('th', {}, x)))),
      h('tbody', {}, r.people.slice().sort((a, b) => a.equipo - b.equipo || a.nombre.localeCompare(b.nombre)).map(p => {
        const c = (r.room.teams.find(t => t.n === p.equipo) || { color: { texto: '#999' } }).color;
        return h('tr', {}, h('td', {}, h('span', { class: 'swatch', style: { background: c.texto } }), p.equipoNombre), h('td', {}, p.nombre), h('td', {}, p.email), h('td', {}, p.org), h('td', { class: 'who' }, p.fecha), h('td', {}, chip(CORREO, p.correo)));
      })))) : h('p', { class: 'note' }, 'Todavía nadie ha finalizado. Los datos se piden solo al pulsar "Finalizar".'));
  };
  const load = async () => {
    try { data = await api('panel', { rid, fk }); setMsg(out, '', ''); status.textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-MX'); paint(); }

    h('section', { class: 'card' }, h('div', { style: { display: 'flex', justifyContent: 'space-between', gap: '10px', flexWrap: 'wrap', alignItems: 'center' } }, h('h2', {}, 'Quién finalizó'), csv), out, tableBox));
  load(); setInterval(() => { if (!document.hidden && confirming == null) load(); }, 20000);

(function start() {
